<title>Marvel Rush · Héros A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: codex de héros — une carte par héros : scène animée (boucle d'attaque) à gauche, fiche technique + 3 poses clés à droite */
:root{
  --sheet:#e2e2e8;
  --card:#f4f4f8;
  --edge:#d2d1dc;
  --ink:#1d1733;
  --muted:#5e5976;
  --gold:#f6c64a;
  --leg:#f2a93b; --epi:#9b59e6; --rare:#3c8bf0;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --dur:2.6s;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--sheet);color:var(--ink);font-family:var(--body);font-weight:600;line-height:1.45;
  background-image:radial-gradient(circle,rgba(29,23,51,.06) 1.2px,transparent 1.3px);background-size:14px 14px}
.wrap{max-width:1120px;margin:0 auto;padding-block:28px 56px;padding-inline:16px}

/* En-tête */
header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 24px;align-items:end;margin-bottom:26px}
.logo{font-family:var(--display);font-weight:400;font-size:clamp(2.4rem,8vw,4.4rem);line-height:.9;margin:0;color:var(--gold);letter-spacing:.01em;
  text-shadow:3px 0 var(--ink),-3px 0 var(--ink),0 3px var(--ink),0 -3px var(--ink),2px 2px var(--ink),-2px -2px var(--ink),2px -2px var(--ink),-2px 2px var(--ink),0 7px 0 #b8322f,3px 7px 0 var(--ink),-3px 7px 0 var(--ink),0 10px 0 var(--ink)}
.logo span{color:#e8413b}
.sub{font-family:var(--display);font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 0}
.controls{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.legend{font-size:.84rem;color:var(--muted);max-width:32ch;text-align:right;margin:0}
button{font:inherit;font-family:var(--display);letter-spacing:.05em;text-transform:uppercase;font-size:.85rem;background:var(--ink);color:var(--gold);border:0;border-radius:999px;padding:9px 18px;cursor:pointer;box-shadow:0 3px 0 #000}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
button:focus-visible{outline:3px solid var(--rare);outline-offset:3px}

/* Cartes */
.cards{display:grid;gap:22px}
.card{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;background:var(--card);border:2px solid var(--edge);border-radius:28px;padding:18px;box-shadow:0 6px 0 var(--edge)}
.stageWrap{position:relative;min-width:0}
.stage{display:block;width:100%;max-width:100%;aspect-ratio:1/1;border-radius:22px;border:4px solid var(--rar);
  background:radial-gradient(circle at 50% 36%,#fff 0,var(--tint) 58%,var(--tint2) 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.6),0 4px 0 var(--ink)}
.badge{position:absolute;left:14px;top:14px;font-family:var(--display);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:#fff;padding:4px 10px;border-radius:999px;display:flex;gap:6px;align-items:center}
.badge i{width:8px;height:8px;border-radius:50%;background:#ff4f4f;box-shadow:0 0 0 0 rgba(255,79,79,.6);animation:rec 1.4s infinite}
@keyframes rec{50%{box-shadow:0 0 0 5px rgba(255,79,79,0)}}
.side{min-width:0;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.num{font-family:var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
h2{font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,4vw,2.3rem);line-height:1;margin:0;text-wrap:balance}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--display);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--ink);color:var(--gold)}
.chip.r{background:var(--rar);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.stats{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 10px;margin:0;font-size:.8rem;align-items:center}
.stats dt{font-family:var(--display);letter-spacing:.04em;color:var(--muted);text-transform:uppercase;font-size:.72rem}
.stats dd{margin:0;display:flex;gap:4px}
.stats dd span{flex:1;max-width:34px;height:10px;border-radius:4px;background:#dcdbe5;border:2px solid transparent}
.stats dd span.on{background:var(--rar);border-color:var(--ink)}
.desc{display:grid;gap:6px;font-size:.88rem}
.desc p{margin:0}
.desc b{font-family:var(--display);font-weight:400;letter-spacing:.03em}
.poses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:auto}
figure{margin:0;display:flex;flex-direction:column;gap:5px;align-items:center}
.tile{display:block;width:100%;max-width:100%;aspect-ratio:1/1;border-radius:16px;border:2px solid var(--edge);background:radial-gradient(circle at 50% 38%,#fff 0,var(--tint) 85%)}
figcaption{font-family:var(--display);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
footer{margin-top:26px;font-size:.8rem;color:var(--muted);max-width:70ch}

@media (max-width:760px){.card{grid-template-columns:minmax(0,1fr)}header{grid-template-columns:minmax(0,1fr)}.controls{align-items:flex-start}.legend{text-align:left}}

/* ---- Moteur d'animation ---- */
.arm,.body,.headT,.grow{transform-box:view-box}
.fx,.pop,.ring,.wig{transform-box:fill-box;transform-origin:center}
.fx{animation:pulse .5s ease-in-out infinite alternate}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 5s linear infinite}
.wig{transform-origin:50% 100%;animation:wig .45s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(.9);opacity:.85}to{transform:scale(1.07);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wig{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}

.anim .w-wind,.anim .w-rel,.anim .w-act{opacity:0}
.anim .w-rest{animation:wRest var(--dur) infinite step-end}
.anim .w-wind{animation:wWind var(--dur) infinite step-end}
.anim .w-rel{animation:wRel var(--dur) infinite step-end}
.anim .w-act{animation:wAct var(--dur) infinite step-end}
.anim .w-notrel{animation:wNot var(--dur) infinite step-end}
@keyframes wRest{0%{opacity:1}16%{opacity:0}82%{opacity:1}}
@keyframes wWind{0%{opacity:0}16%{opacity:1}49%{opacity:0}}
@keyframes wRel{0%{opacity:0}49%{opacity:1}82%{opacity:0}}
@keyframes wAct{0%{opacity:0}16%{opacity:1}82%{opacity:0}}
@keyframes wNot{0%{opacity:1}49%{opacity:0}82%{opacity:1}}
.anim .grow{animation:grow var(--dur) infinite}
@keyframes grow{0%,49%{transform:scaleX(0)}55%,100%{transform:scaleX(1)}}
.anim .pop{animation:pop var(--dur) infinite}
@keyframes pop{0%,49%{transform:scale(.3)}54%{transform:scale(1.18)}60%,100%{transform:scale(1)}}
.anim .ring{animation:ring var(--dur) infinite ease-out}
@keyframes ring{0%,49%{transform:scale(.2);opacity:1}78%,100%{transform:scale(1.35);opacity:0}}
.anim.shake .scene{animation:shake var(--dur) infinite}
@keyframes shake{0%,50%{transform:translate(0,0)}52%{transform:translate(-5px,3px)}54%{transform:translate(5px,-2px)}56%{transform:translate(-4px,1px)}58%{transform:translate(3px,-1px)}61%,100%{transform:translate(0,0)}}

.paused *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.anim *,.fx,.spin,.wig,.badge i{animation:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1 class="logo">MARVEL <span>RUSH</span></h1>
      <p class="sub">Codex des héros · Pack Marvel · Planche A</p>
    </div>
    <div class="controls">
      <button id="toggle" type="button" aria-pressed="false">Pause</button>
      <p class="legend">Chaque scène joue la boucle d’attaque du héros : repos, préparation, frappe. Les trois poses clés sont à droite.</p>
    </div>
  </header>
  <main class="cards" id="sheet"></main>
  <footer>Visuels de prototype dessinés en SVG. Raretés et statistiques sont des propositions à équilibrer en test.</footer>
</div>

<script>
const O='#1d1733', SK='#ffd3ad', SKD='#e9a982';
let n=0;
const f=v=>(+v).toFixed(1);

/* ---------- primitives de dessin ---------- */
function shaded(shape,base,dark,dx=-8,dy=-7){
  const id='c'+(n++);
  return `<clipPath id="${id}">${shape('')}</clipPath>${shape(`fill="${dark}"`)}<g clip-path="url(#${id})"><g transform="translate(${dx} ${dy})">${shape(`fill="${base}"`)}</g></g>${shape(`fill="none" stroke="${O}" stroke-width="5" stroke-linejoin="round"`)}`;
}
function clip(shape,content){const id='k'+(n++);return `<clipPath id="${id}">${shape('')}</clipPath><g clip-path="url(#${id})">${content}</g>`}
const gloss=(x,y,rx,ry,r=-35,o=.55)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" transform="rotate(${r} ${x} ${y})" fill="#fff" opacity="${o}"/>`;
const limb=(x1,y1,x2,y2,c,w)=>`<path d="M${x1} ${y1}L${x2} ${y2}" stroke="${O}" stroke-width="${w+9}" stroke-linecap="round"/><path d="M${x1} ${y1}L${x2} ${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/><path d="M${x1-w*.22} ${y1}L${x2-w*.22} ${y2}" stroke="#fff" stroke-width="${f(w*.18)}" stroke-linecap="round" opacity=".28"/>`;
const hand=(x,y,c,r=11)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" stroke="${O}" stroke-width="4.5"/><circle cx="${f(x-r*.35)}" cy="${f(y-r*.35)}" r="${f(r*.3)}" fill="#fff" opacity=".5"/>`;
function star(x,y,R,r,k,rot=0){x=+x;y=+y;const a=[];for(let i=0;i<k*2;i++){const t=rot+Math.PI*i/k,rr=i%2?r:R;a.push(f(x+Math.cos(t)*rr)+','+f(y+Math.sin(t)*rr))}return a.join(' ')}
const glow=(x,y,r,c)=>`<g class="fx"><circle cx="${x}" cy="${y}" r="${r}" fill="${c}" opacity=".22"/><circle cx="${x}" cy="${y}" r="${f(r*.62)}" fill="${c}" opacity=".5"/><circle cx="${x}" cy="${y}" r="${f(r*.3)}" fill="#fff"/></g>`;
const burst=(x,y,R,c,c2='#fff')=>`<g class="fx"><polygon points="${star(x,y,R,R*.5,9)}" fill="${c}" stroke="${O}" stroke-width="4" stroke-linejoin="round"/><polygon points="${star(x,y,R*.58,R*.3,9,.35)}" fill="${c2}"/></g>`;
const beam=(x1,y1,x2,y2,w,c)=>`<g class="fx"><path d="M${f(x1)} ${f(y1)}L${f(x2)} ${f(y2)}" stroke="${c}" stroke-width="${w+18}" stroke-linecap="round" opacity=".25"/><path d="M${f(x1)} ${f(y1)}L${f(x2)} ${f(y2)}" stroke="${O}" stroke-width="${w+8}" stroke-linecap="round"/><path d="M${f(x1)} ${f(y1)}L${f(x2)} ${f(y2)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/><path d="M${f(x1)} ${f(y1)}L${f(x2)} ${f(y2)}" stroke="#fff" stroke-width="${f(w*.38)}" stroke-linecap="round"/></g>`;
const bolt=(pts,c='#7fd8ff')=>{const d='M'+pts.map(p=>p.join(' ')).join(' L');return `<g class="fx"><path d="${d}" stroke="${O}" stroke-width="10" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="${d}" stroke="${c}" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="${d}" stroke="#fff" stroke-width="2" fill="none" stroke-linejoin="round"/></g>`};
function sparks(x,y,r,c,k=8){let s='';for(let i=0;i<k;i++){const a=i*2*Math.PI/k+.2;s+=`<path d="M${f(x+Math.cos(a)*r*.6)} ${f(y+Math.sin(a)*r*.6)}L${f(x+Math.cos(a)*r)} ${f(y+Math.sin(a)*r)}" stroke="${O}" stroke-width="6" stroke-linecap="round"/><path d="M${f(x+Math.cos(a)*r*.6)} ${f(y+Math.sin(a)*r*.6)}L${f(x+Math.cos(a)*r)} ${f(y+Math.sin(a)*r)}" stroke="${c}" stroke-width="3" stroke-linecap="round"/>`}return `<g class="fx">${s}</g>`}
function mandala(x,y,r){
  let t='';for(let i=0;i<16;i++){const a=i*Math.PI/8;t+=`<path d="M${f(x+Math.cos(a)*r*.8)} ${f(y+Math.sin(a)*r*.8)}L${f(x+Math.cos(a)*r*.94)} ${f(y+Math.sin(a)*r*.94)}"/>`}
  return `<g class="spin"><circle cx="${x}" cy="${y}" r="${r}" fill="#ff9b2f" fill-opacity=".16" stroke="#ff9b2f" stroke-opacity=".35" stroke-width="${f(r*.18)}"/><g stroke="#ffad40" stroke-width="2.6" fill="none"><circle cx="${x}" cy="${y}" r="${r}"/><circle cx="${x}" cy="${y}" r="${f(r*.7)}"/><polygon points="${star(x,y,r*.7,r*.7,4)}"/><polygon points="${star(x,y,r*.7,r*.7,4,Math.PI/4)}"/>${t}</g><circle cx="${x}" cy="${y}" r="${f(r*.18)}" fill="#fff3d6"/></g>`;
}
const torsoD='M58 202 C56 160 70 138 100 136 C130 138 144 160 142 202Z';
const torso=(c,d,path=torsoD)=>shaded(a=>`<path d="${path}" ${a}/>`,c,d,-10,-4);
const headS=a=>`<circle cx="100" cy="84" r="56" ${a}/>`;
const head=(c,d)=>shaded(headS,c,d)+gloss(76,50,14,8);
const cheeks=`<ellipse cx="70" cy="108" rx="8" ry="5" fill="#ff7c7c" opacity=".38"/><ellipse cx="130" cy="108" rx="8" ry="5" fill="#ff7c7c" opacity=".38"/>`;
const mirror=s=>`<g transform="translate(200 0) scale(-1 1)">${s}</g>`;
const shadow=(rx=60)=>`<ellipse cx="100" cy="207" rx="${rx}" ry="8" fill="${O}" opacity=".16"/>`;

function face(p,o={}){
  let s='';const ec=o.eye||O, br=o.brow||O;
  [[80,1],[120,-1]].forEach(([x,d])=>{
    const ry=p==2?8.5:10;
    s+=`<ellipse cx="${x}" cy="95" rx="7.5" ry="${ry}" fill="${ec}"/>`;
    if(ec!==O) s+=`<ellipse cx="${x}" cy="${f(95-ry*.45)}" rx="6.5" ry="${f(ry*.45)}" fill="${O}" opacity=".45"/>`;
    s+=`<circle cx="${x+2.5}" cy="${p==2?91:90}" r="3.2" fill="#fff"/><circle cx="${x-2.5}" cy="99" r="1.5" fill="#fff" opacity=".85"/>`;
    s+=p>0?`<path d="M${x-11*d} 78 L${x+9*d} 85" stroke="${br}" stroke-width="5.5" stroke-linecap="round"/>`
          :`<path d="M${x-9} 80 Q${x} 74 ${x+9} 80" stroke="${br}" stroke-width="4.5" fill="none" stroke-linecap="round"/>`;
  });
  if(!o.noMouth){
    if(p==0) s+=`<path d="M92 115 Q100 121 108 115" stroke="${O}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
    else if(p==1) s+=`<path d="M91 117 Q100 114 109 116" stroke="${O}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
    else s+=`<path d="M89 111 Q100 109 111 111 Q109 128 100 129 Q91 128 89 111Z" fill="#7a1f2b" stroke="${O}" stroke-width="3.5" stroke-linejoin="round"/><path d="M91 112 H109" stroke="#fff" stroke-width="3"/><path d="M94 123 Q100 120 106 123" stroke="#e85a6e" stroke-width="3" fill="none"/>`;
  }
  return s+(o.noCheeks?'':cheeks);
}

/* ---------- contexte de pose : statique (0,1,2) ou animé ---------- */
const WIN={'0':'rest','1':'wind','2':'rel','1,2':'act','0,1':'notrel'};
function tip(c,side,p,d){const [sx,sy]=c.sh[side];const a=c.poses[p][side]*Math.PI/180;return [sx-Math.sin(a)*d,sy+Math.cos(a)*d]}
function dirOf(c,side,p){const a=c.poses[p][side]*Math.PI/180;return [-Math.sin(a),Math.cos(a)]}
const bodyT=b=>{const [tx,ty,r,sx,sy]=b||[0,0,0,1,1];return `translate(${tx}px,${ty}px) rotate(${r}deg) scale(${sx},${sy})`};
const headT=h=>{const [tx,ty,s]=h||[0,0,1];return `translate(${tx}px,${ty}px) scale(${s})`};
function ctx(c,mode){
  const A=mode==='anim';
  return {
    when:(list,svg)=>A?`<g class="w-${WIN[list.join()]}">${svg}</g>`:(list.includes(mode)?svg:''),
    byPose:fn=>A?[0,1,2].map(i=>`<g class="w-${['rest','wind','rel'][i]}">${fn(i)}</g>`).join(''):fn(mode),
    arm:(side,inner)=>{const [sx,sy]=c.sh[side];return `<g class="arm arm${side}" style="transform-origin:${sx}px ${sy}px;${A?'':`transform:rotate(${c.poses[mode][side]}deg)`}">${inner(sx,sy)}</g>`},
    body:svg=>`<g class="body" style="transform-origin:100px 206px;${A?'':`transform:${bodyT(c.poses[mode].body)}`}">${svg}</g>`,
    head:svg=>`<g class="headT" style="transform-origin:100px 132px;${A?'':`transform:${headT(c.poses[mode].head)}`}">${svg}</g>`,
  };
}
function beamFrom(c,side,d,len,w,col){
  const [x0,y0]=tip(c,side,2,d),[dx,dy]=dirOf(c,side,2);
  return `<g class="grow" style="transform-origin:${f(x0)}px ${f(y0)}px">${beam(x0,y0,x0+dx*len,y0+dy*len,w,col)}</g><g class="pop">${burst(f(x0),f(y0),19,col)}</g>`;
}

/* ---------- héros ---------- */
const roster=[
{
  id:'ironman',name:'Iron Man',role:'Dégâts',rarity:'Légendaire',rar:'var(--leg)',tint:'#ffd8c8',tint2:'#f4a98f',stats:[4,3,4],
  atk:'Rayon répulseur sur la cible la plus proche.',skill:'Uni-Beam : toutes les 10 s, un laser de poitrine transperce toute la ligne.',
  sh:{L:[68,150],R:[132,150]},
  poses:[{L:12,R:-12},{L:24,R:-150,body:[-2,-3,-3,1,1]},{L:34,R:-96,body:[-7,0,-5,1,1]}],
  draw(x){
    const R='#d8312f',RD='#9c1b24',G='#f6c64a',GD='#cf962a',C='#6fe9ff';
    const armIn=(sx,sy)=>limb(sx,sy,sx,sy+38,R,15)+`<rect x="${sx-9}" y="${sy+19}" width="18" height="7" rx="3" fill="${G}" stroke="${O}" stroke-width="3"/>`+hand(sx,sy+38,R)
      +x.when([1,2],glow(sx,sy+49,15,C));
    let b=torso(R,RD);
    b+=shaded(a=>`<path d="M78 138 Q100 147 122 138 L117 152 Q100 158 83 152Z" ${a}/>`,G,GD,-3,-3);
    b+=shaded(a=>`<path d="M84 180 L116 180 L121 203 L79 203Z" ${a}/>`,G,GD,-3,-3)+`<path d="M86 191 H114 M100 180 V203" stroke="${GD}" stroke-width="2.5"/>`;
    b+=`<path d="M64 170 Q70 186 66 200 M136 170 Q130 186 134 200" stroke="${RD}" stroke-width="3" fill="none"/>`;
    b+=x.when([1,2],glow(100,167,26,C));
    b+=`<circle cx="100" cy="167" r="11" fill="#e4fdff" stroke="${O}" stroke-width="4"/><circle cx="100" cy="167" r="6" fill="none" stroke="${C}" stroke-width="3"/>`;
    b+=head(R,RD)+`<path d="M100 30 V60" stroke="${RD}" stroke-width="3" stroke-linecap="round"/>`;
    const ear=`<circle cx="45" cy="96" r="9" fill="${G}" stroke="${O}" stroke-width="3.5"/><circle cx="45" cy="96" r="3.5" fill="${GD}"/>`;
    b+=ear+mirror(ear);
    b+=shaded(a=>`<path d="M62 76 Q100 64 138 76 Q140 114 122 132 Q100 142 78 132 Q60 114 62 76Z" ${a}/>`,G,GD,-4,-4);
    b+=`<path d="M70 114 Q100 130 130 114" stroke="${GD}" stroke-width="2.5" fill="none"/>`+gloss(84,78,10,4,-12,.5);
    b+=x.byPose(p=>{
      const eL=p==0?`<path d="M70 90 L95 95 L93 103 L72 99Z"/>`:`<path d="M70 92 L95 96 L93 102 L72 98Z"/>`;
      const g=p?`<g class="fx"><ellipse cx="82" cy="96" rx="18" ry="9" fill="${C}" opacity=".5"/><ellipse cx="118" cy="96" rx="18" ry="9" fill="${C}" opacity=".5"/></g>`:'';
      return g+`<g fill="#eaffff" stroke="${O}" stroke-width="3.5" stroke-linejoin="round">${eL}${mirror(eL)}</g>`;
    });
    b+=`<path d="M86 124 L114 124" stroke="${O}" stroke-width="3.5" stroke-linecap="round"/>`;
    b+=x.arm('L',armIn)+x.arm('R',armIn);
    b+=shaded(a=>`<circle cx="64" cy="147" r="15" ${a}/>`,R,RD,-4,-4)+shaded(a=>`<circle cx="136" cy="147" r="15" ${a}/>`,R,RD,-4,-4);
    b+=gloss(60,141,5,3,-30,.6)+gloss(132,141,5,3,-30,.6);
    b+=x.when([2],beamFrom(this,'R',50,120,20,C));
    return shadow()+x.body(b);
  }
},
{
  id:'spiderman',name:'Spider-Man',role:'Contrôle',rarity:'Épique',rar:'var(--epi)',tint:'#d5e0ff',tint2:'#93abef',stats:[2,5,3],
  atk:'Tir de toile rapide.',skill:'Toile collante : ralentit de 30 %, cumulable jusqu’à immobiliser.',
  sh:{L:[68,150],R:[132,150]},
  poses:[{L:12,R:-12},{L:150,R:-40,body:[0,8,-3,1.05,.92]},{L:30,R:-118,body:[5,-6,5,1,1]}],
  draw(x){

    b+=x.when([2],`<g class="pop"><path d="M${f(hx-6)} ${f(hy-18)} l18 10 M${f(hx-6)} ${f(hy-6)} l20 6 M${f(hx-6)} ${f(hy+6)} l18 2" stroke="#c7d0ff" stroke-width="4" stroke-linecap="round"/></g>`+mirror(`<g class="pop"><path d="M${f(200-gx-6)} ${f(gy-18)} l18 10 M${f(200-gx-6)} ${f(gy-6)} l20 6 M${f(200-gx-6)} ${f(gy+6)} l18 2" stroke="#c7d0ff" stroke-width="4" stroke-linecap="round"/></g>`));
    return shadow(64)+x.body(b);
  }
},

/* ---------- CSS d'animation propre à chaque héros ---------- */
function seg(name,v){
  return `@keyframes ${name}{0%,10%{transform:${v[0]};animation-timing-function:cubic-bezier(.25,.8,.35,1)}34%,46%{transform:${v[1]};animation-timing-function:cubic-bezier(.85,0,1,.55)}52%,72%{transform:${v[2]};animation-timing-function:cubic-bezier(.45,0,.3,1)}92%,100%{transform:${v[0]}}}`;
}
let css='';
roster.forEach(c=>{
  const P=c.poses,id=c.id;
  ['L','R'].forEach(s=>{css+=seg(`${id}-${s}`,P.map(p=>`rotate(${p[s]}deg)`))+`.s-${id}.anim .arm${s}{animation:${id}-${s} var(--dur) infinite}`});
  css+=seg(`${id}-B`,P.map(p=>bodyT(p.body)))+`.s-${id}.anim .body{animation:${id}-B var(--dur) infinite}`;
  if(P.some(p=>p.head)) css+=seg(`${id}-H`,P.map(p=>headT(p.head)))+`.s-${id}.anim .headT{animation:${id}-H var(--dur) infinite}`;
});
document.head.insertAdjacentHTML('beforeend',`<style>${css}</style>`);

/* ---------- rendu ---------- */
const labels=['Fiche','Action 1','Action 2'];
const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const svg=(c,mode,cls,label)=>`<svg class="${cls}" viewBox="-40 -5 280 220" role="img" aria-label="${esc(c.name)}, ${label}"><g class="scene">${c.draw(ctx(c,mode))}</g></svg>`;
const bars=v=>[1,2,3,4,5].map(i=>`<span class="${i<=v?'on':''}"></span>`).join('');
document.getElementById('sheet').innerHTML=roster.map((c,i)=>`
  <article class="card" style="--tint:${c.tint};--tint2:${c.tint2};--rar:${c.rar}">
    <div class="stageWrap">
      ${svg(c,'anim',`stage anim s-${c.id}${c.shake?' shake':''}`,'animation d’attaque')}
      <span class="badge"><i></i>Attaque</span>
    </div>
    <div class="side">
      <div class="top"><span class="num">${String(i+1).padStart(2,'0')}</span><h2>${esc(c.name)}</h2></div>
      <div class="chips"><span class="chip">${esc(c.role)}</span><span class="chip r">${esc(c.rarity)}</span></div>
      <dl class="stats">
        <dt>Dégâts</dt><dd>${bars(c.stats[0])}</dd>
        <dt>Vitesse</dt><dd>${bars(c.stats[1])}</dd>
        <dt>Portée</dt><dd>${bars(c.stats[2])}</dd>
      </dl>
      <div class="desc">
        <p><b>Attaque</b> · ${esc(c.atk)}</p>
        <p><b>Compétence</b> · ${esc(c.skill)}</p>
      </div>
      <div class="poses">${[0,1,2].map(p=>`<figure>${svg(c,p,'tile',labels[p])}<figcaption>${labels[p]}</figcaption></figure>`).join('')}</div>
    </div>
  </article>`).join('');

const btn=document.getElementById('toggle');
btn.addEventListener('click',()=>{const on=document.body.classList.toggle('paused');btn.textContent=on?'Lecture':'Pause';btn.setAttribute('aria-pressed',on)});
</script>
